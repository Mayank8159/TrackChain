# Local stack: Postgres/TimescaleDB, backend API, Next.js web, MinIO (S3-compatible) for video.

version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: trackchain-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trackchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackchain_secret}
      POSTGRES_DB: ${POSTGRES_DB:-trackchain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: trackchain-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackchain-backend
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trackchain}:${POSTGRES_PASSWORD:-trackchain_secret}@timescaledb:5432/${POSTGRES_DB:-trackchain}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-trackchain-media}
      ENVIRONMENT: development
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  app:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: trackchain-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  timescaledb_data:
  minio_data:
