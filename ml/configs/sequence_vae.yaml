model:
  name: "sequence_vae"
  seq_len: 80
  n_features: 5
  latent_dim: 16

training:
  epochs: 25
  beta: 0.01
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "AdamW"
  scheduler: "CosineAnnealing"

calibration:
  method: "sigmoid"
  percentile: 99.0
  steepness_k: 2.5
  operating_threshold: 0.50
