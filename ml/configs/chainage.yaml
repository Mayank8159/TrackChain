# Chainage spatial resampling configuration (tc.v1 SOTA).

resampling:
  step_size_m: 0.25          # 25 cm spatial resolution
  min_speed_mps: 0.20        # Drop stationary telemetry to prevent spatial aliasing
  nominal_gauge_mm: 1676.0   # Indian Broad Gauge (1676mm) / Standard Gauge (1435mm)
  window_length_m: 25.0      # Segment window size
  overlap_ratio: 0.20        # 20% overlap between adjacent track segments

chords:
  twist_base_m:
    - 3.0
    - 6.0
  versine_chord_m:
    - 10.0
    - 20.0
  unevenness_chord_m:
    - 10.0
    - 30.0

wavelength_filter:
  highpass_cutoff_m: 70.0    # Remove macro-curves (>70m wavelength)
  order: 3
