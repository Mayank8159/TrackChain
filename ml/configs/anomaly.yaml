# ============================================================================
# PatchCore Visual Anomaly Detection Configuration (tc.v1 SOTA)
# Multi-scale patch extraction, greedy coreset subsampling & calibration
# ============================================================================

model:
  backbone: "wide_resnet50_2"
  fallback_backbone: "resnet18"
  feature_layers:
    - "layer2"
    - "layer3"
  patch_size: 3
  patch_sizes:
    - 3
    - 5
  stride: 1
  coreset_sampling_ratio: 0.08  # Representative subset retention (8%)
  dimension_reduction: false     # Set true for SparseRandomProjection (e.g. 1536 -> 128)
  target_dim: 128
  k_nearest: 1
  distance_metric: "L2"
  anomaly_map_sigma: 4.0
  img_size: 224

calibration:
  threshold_percentile: 99.0   # P99 baseline on normal validation track (target FPR <= 1%)
  sigmoid_k: 0.5               # Sigmoid temperature/steepness factor
  default_threshold: 0.50      # Operating probability threshold for anomaly alert

data:
  normal_dataset_dir: "data/external/rail_normal_only"
  train_split: "train/good"
  valid_split: "valid/good"
  defect_valid_split: "valid/defect"

paths:
  base_weights_dir: "artifacts/base/vision"
  checkpoint_dir: "artifacts/checkpoints/vision"
  calibration_dir: "artifacts/calibration"
  validation_dir: "artifacts/validation/patchcore"
  export_dir: "artifacts/exports/vision"
