# Persistence Rule Fusion Configuration (tc.v1 SOTA)

persistence_window: 3       # Requires 3 consecutive segments (6m) to confirm novel anomalies
known_threshold: 0.60        # Calibrated probability threshold for discrete known defects
novel_threshold: 0.50        # Calibrated probability threshold for novel visual/geometry anomalies

severity_mapping:
  critical: 0.80
  high: 0.65
  medium: 0.50
  low: 0.0
