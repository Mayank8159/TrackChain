# ============================================================================
# TrackChain YOLOv8n Defect Detector Configuration (tc.v1 SOTA)
# Fully integrated hyperparameters, focal loss, augmentations, and domain classes
# ============================================================================

task: detect
mode: train

model:
  name: "yolov8n.pt"
  architecture: "CSPDarknet-C2f-DecoupledHead"
  input_size: [640, 640]
  confidence_threshold: 0.45
  iou_threshold: 0.50
  max_detections: 100

training:
  epochs: 150
  batch_size: 16
  optimizer: "AdamW"
  lr0: 0.0008
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 5.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  cos_lr: true
  patience: 40
  close_mosaic: 30
  box_loss_weight: 7.5
  cls_loss_weight: 0.5
  dfl_loss_weight: 1.5
  label_smoothing: 0.05

augmentations:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 15.0
  translate: 0.2
  scale: 0.7
  shear: 5.0
  perspective: 0.001
  flipud: 0.5
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.15
  copy_paste: 0.3

sahi:
  enabled: false
  slice_height: 320
  slice_width: 320
  overlap_height_ratio: 0.2
  overlap_width_ratio: 0.2

classes:
  0: "missing_fastener"
  1: "defective_clip"
  2: "crack"
  3: "obstruction"
