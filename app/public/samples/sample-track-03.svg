<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect width="640" height="480" fill="#0f172a"/>
  
  <!-- Sleepers -->
  <g fill="#334155" stroke="#475569" stroke-width="2">
    <rect x="120" y="50" width="400" height="30" rx="3"/>
    <rect x="120" y="130" width="400" height="30" rx="3"/>
    <rect x="120" y="210" width="400" height="30" rx="3"/>
    <rect x="120" y="290" width="400" height="30" rx="3"/>
    <rect x="120" y="370" width="400" height="30" rx="3"/>
  </g>

  <!-- Left Steel Running Rail -->
  <rect x="180" y="0" width="28" height="480" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="190" y="0" width="8" height="480" fill="#f8fafc"/>

  <!-- Right Steel Running Rail with Spalling Damage -->
  <rect x="432" y="0" width="28" height="480" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="442" y="0" width="8" height="480" fill="#f8fafc"/>

  <!-- Spalling / Flaking polygon on right railhead -->
  <polygon points="434,220 448,225 452,245 440,250 432,238" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <circle cx="444" cy="235" r="8" fill="#ef4444" opacity="0.6"/>
</svg>
