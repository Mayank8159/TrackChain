# Python project metadata and dependencies for the FastAPI service.

[project]
name = "trackchain-backend"
version = "0.1.0"
description = "FastAPI backend service for TrackChain railway telemetry, defects, and edge processing."
authors = [{ name = "TrackChain Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "boto3>=1.34.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "mangum>=0.17.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
